# Default stack: postgres + api
# Extra services: docker compose --profile full up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-pto-postgres
    restart: unless-stopped
    ports:
      # Host 5433 — avoids conflict with a local Postgres already on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: pto
      POSTGRES_PASSWORD: pto
      POSTGRES_DB: ai_pto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pto -d ai_pto"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-pto-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      # Inside the compose network use service hostname `postgres` and container port 5432
      DATABASE_URL: postgresql://pto:pto@postgres:5432/ai_pto
      AUTH_PROVIDER: ${AUTH_PROVIDER:-zitadel}
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ai-pto-minio
    profiles: ["full"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
