openapi: 3.1.0
info:
  title: PTO AI API
  version: 0.1.0
  summary: API сервиса проверки исполнительной документации
  description: |
    Сервис принимает пакеты цифровых документов (PDF с текстовым слоем, DOCX, XLSX/CSV),
    извлекает данные, проверяет их правилами и отдаёт замечания, комплектность и отчёты.

    **Статус: черновик первого этапа.** OCR не входит в этап: документ без текстового слоя
    получает статус `needs_ocr`. Поля, помеченные `x-draft`, требуют согласования между
    фронтендом и бэкендом (см. раздел «Открытые вопросы» ниже).

    ## Как устроен процесс

    1. `POST /objects/{objectId}/packages` создаёт пакет и возвращает ссылки для загрузки файлов.
    2. Клиент загружает каждый файл по `uploadUrl` (PUT).
    3. `POST /packages/{packageId}/start` запускает обработку.
    4. Прогресс приходит по SSE (`GET /packages/{packageId}/events`) или через `GET /packages/{packageId}`.
    5. Результаты читаются из `documents`, `findings`, `checklist`.
    6. Инженер принимает решения по замечаниям (`PATCH /findings/{findingId}`).
    7. `POST /packages/{packageId}/reports` формирует PDF-отчёт для подрядчика.

    ## Этапы обработки

    Каждый документ проходит этапы `extract → ocr → classify → parse → rules → explain`.
    По каждому этапу хранится статус, любой этап можно перезапустить.

    ## Открытые вопросы (x-draft)

    - Формат `bbox` в `SourceRef`: сейчас доли страницы 0..1 от верхнего левого угла.
    - Механизм авторизации выбирается `AUTH_PROVIDER`: `zitadel` (OIDC Authorization Code + PKCE) или `local` (email/пароль из БД). Сессия в обоих случаях в HttpOnly cookie `ai_pto_session`.
    - SSE или WebSocket для прогресса: сейчас описан SSE.
    - Полный список типов документов (`DocumentType`) уточнить по документации.
  contact:
    name: PTO AI
servers:
  - url: /api
    description: Относительный адрес (за прокси Next.js) или полный адрес бэкенда
tags:
  - name: Auth
    description: Вход и текущий пользователь
  - name: Objects
    description: Строительные объекты
  - name: Packages
    description: Пакеты загрузки и обработка
  - name: Documents
    description: Документы и извлечённые поля
  - name: Findings
    description: Замечания и решения инженера
  - name: Checklist
    description: Комплектность и сводка по объекту
  - name: Reports
    description: PDF-отчёты для подрядчика
security:
  - cookieAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Вход по email и паролю (AUTH_PROVIDER=local)
      security: []
      description: |
        Доступен только при `AUTH_PROVIDER=local`, иначе `404`. Проверяет учётные данные,
        создаёт серверную сессию в PostgreSQL и выставляет HttpOnly cookie `ai_pto_session`.
        Организация и роль берутся из активного membership пользователя и перечитываются на каждом запросе.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Успех — Set-Cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Неверный email или пароль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: invalid_credentials, message: Неверный email или пароль }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Auth]
      operationId: login
      summary: Начать OIDC вход (redirect на ZITADEL)
      security: []
      description: |
        Доступен только при `AUTH_PROVIDER=zitadel` (по умолчанию), иначе `404`.
        Генерирует PKCE challenge, сохраняет state в PostgreSQL и перенаправляет браузер
        на Authorization Endpoint ZITADEL (Authorization Code Flow + PKCE).
      responses:
        "302":
          description: Redirect на ZITADEL login
          headers:
            Location:
              schema: { type: string, format: uri }

  /auth/callback:
    get:
      tags: [Auth]
      operationId: authCallback
      summary: OIDC callback (обмен code на сессию)
      security: []
      description: |
        Обменивает authorization code на токены у ZITADEL, создаёт серверную сессию
        в PostgreSQL и выставляет HttpOnly cookie `ai_pto_session`, затем redirect на `/auth/me`.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
        - name: error_description
          in: query
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Успех — Set-Cookie и redirect на `/auth/me`
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Выход
      responses:
        "204":
          description: Сессия завершена, cookie очищена
          headers:
            Set-Cookie:
              schema: { type: string }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Текущий пользователь
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /protected:
    get:
      tags: [Auth]
      operationId: getProtected
      summary: Smoke-тест SessionGuard
      description: Защищённый endpoint для проверки cookie-сессии без frontend.
      responses:
        "200":
          description: Сессия валидна
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /work-types:
    get:
      tags: [Objects]
      operationId: listWorkTypes
      summary: Справочник видов работ
      description: Вид работ определяет шаблон обязательных документов (комплектность).
      responses:
        "200":
          description: Список видов работ
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /objects:
    get:
      tags: [Objects]
      operationId: listObjects
      summary: Список объектов
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          description: Поиск по названию, адресу, подрядчику
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, readiness, -readiness, lastCheckedAt, -lastCheckedAt]
            default: -lastCheckedAt
      responses:
        "200":
          description: Страница объектов
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConstructionObject" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Objects]
      operationId: createObject
      summary: Создать объект
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectInput" }
      responses:
        "201":
          description: Объект создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstructionObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /objects/{objectId}:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Objects]
      operationId: getObject
      summary: Объект
      responses:
        "200":
          description: Объект
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstructionObject" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Objects]
      operationId: updateObject
      summary: Изменить объект
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectUpdate" }
      responses:
        "200":
          description: Объект обновлён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstructionObject" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Objects]
      operationId: deleteObject
      summary: Удалить объект
      responses:
        "204": { description: Объект удалён }
        "404": { $ref: "#/components/responses/NotFound" }

  /objects/{objectId}/summary:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Checklist]
      operationId: getObjectSummary
      summary: Сводка по объекту (дашборд)
      description: |
        Агрегаты для экрана «Обзор». На первом этапе фронтенд может считать их сам
        из списка замечаний и комплектности, эндпоинт можно реализовать позже.
      responses:
        "200":
          description: Сводка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectSummary" }
        "404": { $ref: "#/components/responses/NotFound" }

  /objects/{objectId}/packages:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Packages]
      operationId: listPackages
      summary: Пакеты объекта
      description: Пакет это версия загрузки. Список отсортирован от новых к старым.
      responses:
        "200":
          description: Пакеты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Package" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Packages]
      operationId: createPackage
      summary: Создать пакет и получить ссылки для загрузки
      description: |
        Принимает описание файлов, создаёт `Package` и `Document` для каждого файла
        и возвращает временные ссылки для загрузки в хранилище.
        Дубликаты по `sha256` помечаются в ответе (`duplicateOf`), повторно не загружаются.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageCreate" }
      responses:
        "201":
          description: Пакет создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageCreated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Файл или пакет превышает допустимый размер
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Неподдерживаемый формат файла
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /packages/{packageId}:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags: [Packages]
      operationId: getPackage
      summary: Состояние пакета
      description: Статус, общий прогресс и документы с этапами. Подходит для поллинга, если SSE недоступен.
      responses:
        "200":
          description: Пакет
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{packageId}/start:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      tags: [Packages]
      operationId: startPackage
      summary: Запустить обработку
      description: Вызывается после того, как все файлы загружены. Идемпотентен.
      responses:
        "202":
          description: Обработка поставлена в очередь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Не все файлы загружены
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /packages/{packageId}/events:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags: [Packages]
      operationId: streamPackageEvents
      summary: Поток событий обработки (SSE)
      x-draft: true
      description: |
        Server-Sent Events. Соединение остаётся открытым до завершения пакета.
        Каждое событие содержит JSON по схеме `PackageEvent`. Имя события (`event:`) совпадает
        с полем `type`. При подключении сервер сначала отправляет `package.snapshot`
        с текущим состоянием. Авторизация — cookie-сессия `ai_pto_session`
        (браузерный `EventSource` отправляет cookies same-origin автоматически).
      responses:
        "200":
          description: Поток событий
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/PackageEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{packageId}/reports:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      tags: [Reports]
      operationId: createReport
      summary: Сформировать отчёт по пакету
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCreate" }
      responses:
        "202":
          description: Генерация запущена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Обработка пакета ещё не завершена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /objects/{objectId}/documents:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: Документы объекта
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: packageId
          in: query
          description: По умолчанию берётся последний пакет
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/DocumentType" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DocumentStatus" }
        - name: q
          in: query
          description: Поиск по имени файла
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [fileName, -fileName, createdAt, -createdAt, findings, -findings]
            default: -createdAt
      responses:
        "200":
          description: Страница документов
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Карточка документа
      description: Метаданные, этапы обработки и извлечённые поля.
      responses:
        "200":
          description: Документ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Documents]
      operationId: updateDocument
      summary: Изменить тип документа
      description: Ручная смена типа запускает повторное извлечение полей и проверку правил.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { $ref: "#/components/schemas/DocumentType" }
      responses:
        "200":
          description: Документ обновлён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Удалить документ
      responses:
        "204": { description: Документ удалён }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}/file:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      operationId: getDocumentFile
      summary: Ссылка на исходный файл
      description: Временная ссылка для просмотра или скачивания оригинала.
      responses:
        "200":
          description: Ссылка на файл
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}/fields:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    patch:
      tags: [Documents]
      operationId: updateDocumentFields
      summary: Исправить извлечённые поля
      description: |
        Изменённые поля помечаются `editedManually: true`, исходное значение сохраняется
        в `originalValue`. После изменения запускается перепроверка связанных правил
        (этап `rules` документа переходит в `running`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string, examples: [actDate] }
                      value: { type: [string, "null"] }
      responses:
        "200":
          description: Документ с обновлёнными полями
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /documents/{documentId}/recheck:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      tags: [Documents]
      operationId: recheckDocument
      summary: Перезапустить обработку документа
      description: |
        Перезапускает указанные этапы (по умолчанию `rules`) и все последующие.
        Результаты предыдущих этапов берутся из БД, LLM повторно не вызывается,
        если это не требуется.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fromStage: { $ref: "#/components/schemas/Stage" }
      responses:
        "202":
          description: Перепроверка запущена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/NotFound" }

  /objects/{objectId}/findings:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Findings]
      operationId: listFindings
      summary: Замечания объекта
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: severity
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/Severity" }
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/FindingStatus" }
        - name: documentId
          in: query
          schema: { type: string, format: uuid }
        - name: documentType
          in: query
          schema: { $ref: "#/components/schemas/DocumentType" }
        - name: ruleId
          in: query
          schema: { type: string }
        - name: packageId
          in: query
          description: По умолчанию берётся последний пакет
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Поиск по тексту замечания
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [severity, -severity, confidence, -confidence, createdAt, -createdAt]
            default: severity
      responses:
        "200":
          description: Страница замечаний
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, counts]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Finding" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
                  counts:
                    description: Счётчики по текущим фильтрам, кроме серьёзности и статуса (для переключателей в интерфейсе)
                    type: object
                    properties:
                      bySeverity: { $ref: "#/components/schemas/SeverityCounts" }
                      byStatus:
                        type: object
                        additionalProperties: { type: integer, minimum: 0 }
        "404": { $ref: "#/components/responses/NotFound" }

  /findings/bulk:
    post:
      tags: [Findings]
      operationId: bulkUpdateFindings
      summary: Массовое изменение статуса замечаний
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
                status: { $ref: "#/components/schemas/FindingStatus" }
                comment: { type: string }
      responses:
        "200":
          description: Результат
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer, minimum: 0 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /findings/{findingId}:
    parameters:
      - $ref: "#/components/parameters/FindingId"
    get:
      tags: [Findings]
      operationId: getFinding
      summary: Замечание
      responses:
        "200":
          description: Замечание
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Findings]
      operationId: updateFinding
      summary: Решение инженера по замечанию
      description: |
        Меняет статус и/или комментарий. При отклонении (`dismissed`) комментарий обязателен.
        Каждое изменение записывается в историю.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingUpdate" }
      responses:
        "200":
          description: Замечание обновлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /findings/{findingId}/history:
    parameters:
      - $ref: "#/components/parameters/FindingId"
    get:
      tags: [Findings]
      operationId: getFindingHistory
      summary: История изменений замечания
      responses:
        "200":
          description: История
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FindingHistoryEntry" }
        "404": { $ref: "#/components/responses/NotFound" }

  /objects/{objectId}/checklist:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Checklist]
      operationId: getChecklist
      summary: Комплектность объекта
      description: Сравнивает обязательные документы для вида работ с найденными в последнем пакете.
      parameters:
        - name: packageId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Чек-лист
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
        "404": { $ref: "#/components/responses/NotFound" }

  /objects/{objectId}/reports:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Reports]
      operationId: listReports
      summary: Отчёты объекта
      responses:
        "200":
          description: Отчёты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/{reportId}:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [Reports]
      operationId: getReport
      summary: Отчёт
      responses:
        "200":
          description: Отчёт
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/{reportId}/download:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [Reports]
      operationId: downloadReport
      summary: Скачать PDF отчёта
      responses:
        "200":
          description: PDF-файл
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Отчёт ещё не готов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ai_pto_session
      description: Opaque-токен сессии; в PostgreSQL хранится только его SHA-256, роль и организация читаются из актуального membership.

  parameters:
    ObjectId:
      name: objectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackageId:
      name: packageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FindingId:
      name: findingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: unauthorized, message: Требуется вход в систему }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: not_found, message: Ресурс не найден }
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: validation_error
            message: Проверьте введённые данные
            details:
              - { field: name, message: Обязательное поле }

  schemas:
    # ---------- Общее ----------
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинный код ошибки
          examples: [validation_error]
        message:
          type: string
          description: Понятное человеку описание, что случилось и что делать
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    SeverityCounts:
      type: object
      required: [error, warning, info, critical]
      properties:
        error: { type: integer, minimum: 0 }
        warning: { type: integer, minimum: 0 }
        info: { type: integer, minimum: 0 }
        critical: { type: integer, minimum: 0 }

    # ---------- Перечисления ----------
    Severity:
      type: string
      enum: [error, warning, info, critical]
      description: Ошибка (не пройдёт приёмку), замечание (проверить вручную), сведения, критично

    FindingStatus:
      type: string
      enum: [open, accepted, dismissed, fixed]
      description: Открыто, принято (в отчёт подрядчику), отклонено (ложное срабатывание), исправлено

    DocumentType:
      type: string
      x-draft: true
      enum:
        - aosr
        - general_work_log
        - concrete_log
        - welding_log
        - material_passport
        - as_built_scheme
        - test_report
        - other
        - unknown
      description: |
        aosr: акт освидетельствования скрытых работ; general_work_log: общий журнал работ;
        concrete_log: журнал бетонных работ; welding_log: журнал сварки;
        material_passport: паспорт материалов; as_built_scheme: исполнительная схема;
        test_report: протокол испытаний; unknown: тип не определён.

    DocumentStatus:
      type: string
      enum: [awaiting_upload, uploaded, queued, processing, done, failed, needs_ocr]
      description: |
        Статусы хранения/очереди совпадают с Prisma DocumentStatus.
        needs_ocr: API-флаг для файла без текстового слоя (скан); на первом этапе не обрабатывается.

    Stage:
      type: string
      enum: [extract, ocr, classify, parse, rules, explain]
      description: Совпадает с Prisma StageName (этап report в БД отсутствует)

    StageStatus:
      type: string
      enum: [pending, running, succeeded, failed, skipped]
      description: Совпадает с Prisma StageStatus (succeeded вместо done)

    PackageStatus:
      type: string
      enum: [uploading, queued, processing, done, partial, failed]
      description: partial означает, что часть документов не удалось обработать, остальные готовы

    ChecklistStatus:
      type: string
      enum: [missing, partial, complete]
      description: Совпадает с Prisma ChecklistItemStatus

    ReportStatus:
      type: string
      enum: [queued, generating, ready, failed]
      description: Совпадает с Prisma ReportStatus

    # ---------- Пользователь ----------
    User:
      type: object
      required: [id, email, name, organizationId, role]
      properties:
        id:
          type: string
          description: OIDC subject (`sub`) при ZITADEL, UUID пользователя при local
        email: { type: string, format: email }
        name: { type: string }
        organizationId:
          type: string
          description: ZITADEL organization / resource owner id при ZITADEL, UUID организации при local
        role:
          type: string
          enum: [engineer, contractor]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    ProtectedResponse:
      type: object
      required: [ok, user]
      properties:
        ok: { type: boolean, examples: [true] }
        user: { $ref: "#/components/schemas/User" }

    # ---------- Объекты ----------
    WorkType:
      type: object
      required: [id, name]
      properties:
        id: { type: string, examples: [monolith] }
        name: { type: string, examples: [Монолитные работы] }

    ObjectInput:
      type: object
      required: [name, workTypeId]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: string }
        customer: { type: string, description: Заказчик }
        contractor: { type: string, description: Подрядчик }
        workTypeId: { type: string }

    ObjectUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: string }
        customer: { type: string }
        contractor: { type: string }
        workTypeId: { type: string }

    ConstructionObject:
      allOf:
        - $ref: "#/components/schemas/ObjectInput"
        - type: object
          required: [id, readiness, findings, createdAt]
          properties:
            id: { type: string, format: uuid }
            readiness:
              type: number
              minimum: 0
              maximum: 1
              description: Готовность пакета документов, доля от 0 до 1
            findings: { $ref: "#/components/schemas/SeverityCounts" }
            lastCheckedAt: { type: [string, "null"], format: date-time }
            createdAt: { type: string, format: date-time }

    # ---------- Пакеты ----------
    PackageCreate:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [fileName, mimeType, sizeBytes]
            properties:
              fileName: { type: string }
              mimeType:
                type: string
                enum:
                  - application/pdf
                  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
                  - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                  - text/csv
              sizeBytes: { type: integer, minimum: 1 }
              sha256:
                type: string
                pattern: "^[a-f0-9]{64}$"
                description: Хэш файла для дедупликации (необязательно)

    PackageCreated:
      type: object
      required: [package, uploads]
      properties:
        package: { $ref: "#/components/schemas/Package" }
        uploads:
          type: array
          items:
            type: object
            required: [documentId, fileName]
            properties:
              documentId: { type: string, format: uuid }
              fileName: { type: string }
              uploadUrl:
                type: [string, "null"]
                format: uri
                description: Ссылка для PUT-загрузки. Пусто, если файл дубликат.
              headers:
                type: object
                additionalProperties: { type: string }
                description: Заголовки, которые нужно передать при загрузке
              expiresAt: { type: string, format: date-time }
              duplicateOf:
                type: [string, "null"]
                format: uuid
                description: Идентификатор уже загруженного документа с тем же хэшем

    Package:
      type: object
      required: [id, objectId, version, status, progress, createdAt]
      properties:
        id: { type: string, format: uuid }
        objectId: { type: string, format: uuid }
        version:
          type: integer
          minimum: 1
          description: Порядковый номер проверки на объекте
        status: { $ref: "#/components/schemas/PackageStatus" }
        progress:
          type: number
          minimum: 0
          maximum: 1
        documentsCount: { type: integer, minimum: 0 }
        findings: { $ref: "#/components/schemas/SeverityCounts" }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }

    PackageDetail:
      allOf:
        - $ref: "#/components/schemas/Package"
        - type: object
          required: [documents]
          properties:
            documents:
              type: array
              items: { $ref: "#/components/schemas/Document" }

    PackageEvent:
      description: |
        Событие SSE. Поле `type` совпадает с именем события.
        - `package.snapshot`: текущее состояние при подключении
        - `document.stage`: изменился статус этапа документа
        - `package.progress`: изменился общий прогресс
        - `package.done`: обработка завершена (статус `done`, `partial` или `failed`)
      oneOf:
        - $ref: "#/components/schemas/PackageSnapshotEvent"
        - $ref: "#/components/schemas/DocumentStageEvent"
        - $ref: "#/components/schemas/PackageProgressEvent"
        - $ref: "#/components/schemas/PackageDoneEvent"
      discriminator:
        propertyName: type
        mapping:
          package.snapshot: "#/components/schemas/PackageSnapshotEvent"
          document.stage: "#/components/schemas/DocumentStageEvent"
          package.progress: "#/components/schemas/PackageProgressEvent"
          package.done: "#/components/schemas/PackageDoneEvent"

    PackageSnapshotEvent:
      type: object
      required: [type, package]
      properties:
        type: { type: string, const: package.snapshot }
        package: { $ref: "#/components/schemas/PackageDetail" }

    DocumentStageEvent:
      type: object
      required: [type, documentId, stage, status]
      properties:
        type: { type: string, const: document.stage }
        documentId: { type: string, format: uuid }
        stage: { $ref: "#/components/schemas/Stage" }
        status: { $ref: "#/components/schemas/StageStatus" }
        error: { $ref: "#/components/schemas/StageError" }

    PackageProgressEvent:
      type: object
      required: [type, progress]
      properties:
        type: { type: string, const: package.progress }
        progress: { type: number, minimum: 0, maximum: 1 }

    PackageDoneEvent:
      type: object
      required: [type, status]
      properties:
        type: { type: string, const: package.done }
        status:
          type: string
          enum: [done, partial, failed]
        findings: { $ref: "#/components/schemas/SeverityCounts" }

    # ---------- Документы ----------
    StageError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [no_text_layer, corrupted_file, llm_unavailable]
        message:
          type: string
          description: Причина простыми словами, показывается пользователю

    StageState:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/StageStatus" }
        error: { $ref: "#/components/schemas/StageError" }
        finishedAt: { type: [string, "null"], format: date-time }

    Document:
      type: object
      required: [id, objectId, packageId, fileName, mimeType, sizeBytes, type, status, stages, findings, createdAt]
      properties:
        id: { type: string, format: uuid }
        objectId: { type: string, format: uuid }
        packageId: { type: string, format: uuid }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        pageCount:
          type: [integer, "null"]
          description: Для PDF; для XLSX число листов
        type: { $ref: "#/components/schemas/DocumentType" }
        typeConfidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        typeEditedManually: { type: boolean, default: false }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        stages:
          type: object
          description: Состояние каждого этапа обработки
          properties:
            extract: { $ref: "#/components/schemas/StageState" }
            ocr: { $ref: "#/components/schemas/StageState" }
            classify: { $ref: "#/components/schemas/StageState" }
            parse: { $ref: "#/components/schemas/StageState" }
            rules: { $ref: "#/components/schemas/StageState" }
            explain: { $ref: "#/components/schemas/StageState" }
        findings: { $ref: "#/components/schemas/SeverityCounts" }
        createdAt: { type: string, format: date-time }

    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/Document"
        - type: object
          required: [fields]
          properties:
            fields:
              type: array
              items: { $ref: "#/components/schemas/ExtractedField" }
            lowConfidenceThreshold:
              type: number
              minimum: 0
              maximum: 1
              default: 0.8
              description: Поля с уверенностью ниже порога интерфейс подсвечивает

    ExtractedField:
      type: object
      required: [key, label, value, confidence, editedManually]
      properties:
        key: { type: string, examples: [actDate] }
        label: { type: string, examples: [Дата акта] }
        value: { type: [string, "null"] }
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source: { $ref: "#/components/schemas/SourceRef" }
        editedManually: { type: boolean }
        originalValue:
          type: [string, "null"]
          description: Значение до ручной правки

    SourceRef:
      type: object
      x-draft: true
      description: |
        Место в файле, откуда взято значение. Для PDF заполняются `page` и `bbox`,
        для XLSX `sheet` и `cell`, для DOCX `paragraph` или `table`.
      required: [documentId]
      properties:
        documentId: { type: string, format: uuid }
        page:
          type: integer
          minimum: 1
          description: Номер страницы PDF, с 1
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number, minimum: 0, maximum: 1 }
          description: "[x0, y0, x1, y1] в долях страницы от верхнего левого угла"
        sheet: { type: string }
        cell:
          type: string
          examples: ["C14"]
        paragraph: { type: integer, minimum: 0 }
        quote:
          type: string
          description: Короткая цитата из источника

    # ---------- Замечания ----------
    NormRef:
      type: object
      required: [doc, clause]
      properties:
        doc: { type: string, examples: [СП 70.13330.2012] }
        clause: { type: string, examples: [п. 5.2.3] }
        url: { type: string, format: uri }

    Finding:
      type: object
      required:
        [
          id,
          objectId,
          documentId,
          packageId,
          ruleId,
          ruleVersion,
          severity,
          message,
          sources,
          confidence,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        objectId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        packageId: { type: string, format: uuid }
        ruleId: { type: string, examples: [aosr.date-after-journal] }
        ruleVersion: { type: string, examples: ["1.0.0"] }
        severity: { $ref: "#/components/schemas/Severity" }
        message:
          type: string
          description: Строгий результат правила, всегда заполнен
        explanation:
          type: [string, "null"]
          description: Пояснение простым языком от LLM, может отсутствовать
        expected: { type: [string, "null"] }
        actual: { type: [string, "null"] }
        normRef: { $ref: "#/components/schemas/NormRef" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status: { $ref: "#/components/schemas/FindingStatus" }
        comment: { type: [string, "null"] }
        decidedBy:
          type: [string, "null"]
          format: uuid
        decidedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FindingUpdate:
      type: object
      minProperties: 1
      properties:
        status: { $ref: "#/components/schemas/FindingStatus" }
        comment: { type: string }

    FindingHistoryEntry:
      type: object
      required: [at, userId, fromStatus, toStatus]
      properties:
        at: { type: string, format: date-time }
        userId: { type: string, format: uuid }
        fromStatus: { $ref: "#/components/schemas/FindingStatus" }
        toStatus: { $ref: "#/components/schemas/FindingStatus" }
        comment: { type: [string, "null"] }

    # ---------- Комплектность и сводка ----------
    Checklist:
      type: object
      required: [readiness, items]
      properties:
        readiness:
          type: number
          minimum: 0
          maximum: 1
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }

    ChecklistItem:
      type: object
      required: [documentType, title, required, found, status, documentIds]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        title: { type: string, examples: [Акты скрытых работ] }
        required:
          type: integer
          minimum: 0
          description: Сколько документов требуется
        found:
          type: integer
          minimum: 0
          description: Сколько найдено
        status: { $ref: "#/components/schemas/ChecklistStatus" }
        documentIds:
          type: array
          items: { type: string, format: uuid }

    ObjectSummary:
      type: object
      required: [readiness, findings, pendingDecisions, byDocumentType, topRules]
      properties:
        readiness:
          type: number
          minimum: 0
          maximum: 1
        findings: { $ref: "#/components/schemas/SeverityCounts" }
        pendingDecisions:
          type: integer
          minimum: 0
          description: Замечаний в статусе open
        byDocumentType:
          type: array
          items:
            type: object
            required: [documentType, counts]
            properties:
              documentType: { $ref: "#/components/schemas/DocumentType" }
              counts: { $ref: "#/components/schemas/SeverityCounts" }
        topRules:
          type: array
          items:
            type: object
            required: [ruleId, title, count]
            properties:
              ruleId: { type: string }
              title: { type: string }
              count: { type: integer, minimum: 1 }
        history:
          type: array
          description: Динамика по проверкам (пакетам)
          items:
            type: object
            required: [packageId, version, findings]
            properties:
              packageId: { type: string, format: uuid }
              version: { type: integer }
              findings: { $ref: "#/components/schemas/SeverityCounts" }
              createdAt: { type: string, format: date-time }
        nextActions:
          type: array
          items:
            type: object
            required: [kind, message]
            properties:
              kind:
                type: string
                enum: [missing_document, pending_findings, failed_document, needs_ocr]
              message: { type: string }
              count: { type: integer }

    # ---------- Отчёты ----------
    ReportCreate:
      type: object
      properties:
        scope:
          type: string
          enum: [accepted, errors, all_open]
          default: accepted
          description: Что включить, принятые замечания, только ошибки или все открытые
        recipient:
          type: string
          description: Кому адресован отчёт (подрядчик)

    Report:
      type: object
      required: [id, objectId, packageId, status, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        objectId: { type: string, format: uuid }
        packageId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ReportStatus" }
        version: { type: integer, minimum: 1 }
        scope: { type: string, enum: [accepted, errors, all_open] }
        recipient: { type: [string, "null"] }
        findingsCount: { type: integer, minimum: 0 }
        error: { $ref: "#/components/schemas/StageError" }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        readyAt: { type: [string, "null"], format: date-time }
