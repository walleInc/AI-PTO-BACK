openapi: 3.1.0
info:
  title: PTO AI API
  version: 0.1.0
  summary: API сервиса проверки исполнительной документации
  description: |
    Сервис принимает пакеты цифровых документов (PDF с текстовым слоем, DOCX, XLSX/CSV),
    извлекает данные, проверяет их правилами и отдаёт замечания, комплектность и отчёты.

    **Статус: черновик первого этапа.** OCR не входит в этап: документ без текстового слоя
    получает статус `needs_ocr`. Поля, помеченные `x-draft`, требуют согласования между
    фронтендом и бэкендом (см. раздел «Открытые вопросы» ниже).

    ## Как устроен процесс

    1. `POST /objects/{objectId}/packages` создаёт пакет и возвращает ссылки для загрузки файлов.
    2. Клиент загружает каждый файл по `url` (PUT) напрямую в хранилище.
    3. `POST /packages/{packageId}/start` проверяет, что все файлы на месте, и запускает обработку.
       Отдельного запроса «загрузка завершена» нет.
    4. Прогресс приходит по SSE (`GET /packages/{packageId}/events`) или через `GET /packages/{packageId}`.
    5. Результаты читаются из `documents`, `findings`, `checklist`.

    Документы обрабатываются независимо: документ в статусе `done` можно открывать (поля,
    замечания), не дожидаясь остальных файлов пакета. Ошибка одного файла не останавливает
    пакет, он завершается со статусом `partial`.
    6. Инженер принимает решения по замечаниям (`PATCH /findings/{findingId}`).
    7. `POST /packages/{packageId}/reports` формирует PDF-отчёт для подрядчика.

    ## Авторизация и роли

    Вход по email и паролю (`POST /auth/login`), сессия в HttpOnly cookie `ai_pto_session`.
    Организация и роль берутся из активного membership и перечитываются на каждом запросе.
    Роли: `owner` (владелец организации) и `engineer`.
    `engineer` — только просмотр объектов (`GET /objects`, `GET /objects/{id}`).
    `owner` — создание, изменение, смена статуса и архивация объектов.
    Все выборки ограничены организацией текущего пользователя.

    ## Объекты

    У одного исполнителя ожидаются единицы и десятки объектов, поэтому `GET /objects` возвращает
    весь список без пагинации, а поиск, фильтры и сортировку клиент делает сам.

    ## Этапы обработки

    Каждый документ проходит этапы `extract → ocr → classify → parse → rules → explain`.
    По каждому этапу хранится статус, любой этап можно перезапустить.

    ## Открытые вопросы (x-draft)

    - Формат `bbox` в `SourceRef`: сейчас доли страницы 0..1 от верхнего левого угла.
    - SSE или WebSocket для прогресса: сейчас описан SSE.
    - Полный список типов документов (`DocumentType`) уточнить по документации.
  contact:
    name: PTO AI
servers:
  - url: /api
    description: Относительный адрес (за прокси Next.js) или полный адрес бэкенда
tags:
  - name: Auth
    description: Вход и текущий пользователь
  - name: Objects
    description: Строительные объекты
  - name: Packages
    description: Пакеты загрузки и обработка
  - name: Documents
    description: Документы и извлечённые поля
  - name: Findings
    description: Замечания и решения инженера
  - name: Checklist
    description: Комплектность и сводка по объекту
  - name: Reports
    description: PDF-отчёты для подрядчика
security:
  - cookieAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Вход по email и паролю
      security: []
      description: |
        Проверяет учётные данные, создаёт серверную сессию в PostgreSQL и выставляет
        HttpOnly cookie `ai_pto_session`. Организация и роль берутся из активного
        membership пользователя и перечитываются на каждом запросе.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Успех — Set-Cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Неверный email или пароль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { code: invalid_credentials, message: Неверный email или пароль }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Выход
      responses:
        "204":
          description: Сессия завершена, cookie очищена
          headers:
            Set-Cookie:
              schema: { type: string }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Текущий пользователь
      responses:
        "200":
          description: Пользователь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /protected:
    get:
      tags: [Auth]
      operationId: getProtected
      summary: Smoke-тест SessionGuard
      description: Защищённый endpoint для проверки cookie-сессии без frontend.
      responses:
        "200":
          description: Сессия валидна
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /object-types:
    get:
      tags: [Objects]
      operationId: listObjectTypes
      summary: Справочник типов объектов
      description: Активные типы вместе с группой.
      responses:
        "200":
          description: Список типов объектов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ObjectType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /work-types:
    get:
      tags: [Objects]
      operationId: listWorkTypes
      summary: Справочник видов работ
      description: Вид работ определяет шаблон обязательных документов (комплектность).
      responses:
        "200":
          description: Список видов работ
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkType" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /counterparties:
    get:
      tags: [Objects]
      operationId: listCounterparties
      summary: Справочник контрагентов
      description: Организации `kind=counterparty` для полей «заказчик» и «подрядчик».
      responses:
        "200":
          description: Список контрагентов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Counterparty" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /objects:
    get:
      tags: [Objects]
      operationId: listObjects
      summary: Список объектов
      description: |
        Все объекты текущей организации одним массивом, без пагинации.
        Архивные не возвращаются, пока не передан `includeArchived=true`.
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Объекты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConstructionObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Objects]
      operationId: createObject
      summary: Создать объект
      description: Только роль `owner`. Объект создаётся в статусе `draft`. `code` уникален внутри организации.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectWrite" }
      responses:
        "201":
          description: Объект создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstructionObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /objects/{objectId}:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Objects]
      operationId: getObject
      summary: Объект
      description: Чужой и несуществующий id отвечают одинаково — 404.
      responses:
        "200":
          description: Объект
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstructionObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Objects]
      operationId: updateObject
      summary: Изменить объект
      description: Только роль `owner`. Те же поля, что при создании. Архивный объект не редактируется (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectWrite" }
      responses:
        "200":
          description: Объект обновлён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstructionObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /objects/{objectId}/status:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    post:
      tags: [Objects]
      operationId: changeObjectStatus
      summary: Сменить статус объекта
      description: |
        Только роль `owner`.
        Допустимые переходы: `draft → active`, `active → on_hold`, `on_hold → active`,
        `active → completed`, `on_hold → completed`. Из `archived` перехода нет.
        При переходе в `completed` пустая `actualEndDate` заполняется текущей датой.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObjectStatusChange" }
      responses:
        "200":
          description: Статус изменён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstructionObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /objects/{objectId}/archive:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    post:
      tags: [Objects]
      operationId: archiveObject
      summary: Архивировать объект
      description: Только роль `owner`. Файлы сохраняются. Повторная архивация — 409.
      responses:
        "200":
          description: Объект в статусе `archived`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConstructionObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /objects/{objectId}/summary:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Checklist]
      operationId: getObjectSummary
      summary: Сводка по объекту (дашборд)
      description: |
        Агрегаты для экрана «Обзор». На первом этапе фронтенд может считать их сам
        из списка замечаний и комплектности, эндпоинт можно реализовать позже.
      responses:
        "200":
          description: Сводка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectSummary" }
        "404": { $ref: "#/components/responses/NotFound" }

  /objects/{objectId}/packages:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Packages]
      operationId: listPackages
      summary: Пакеты объекта
      description: Пакет это версия загрузки. Список отсортирован от новых к старым.
      responses:
        "200":
          description: Пакеты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Package" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Packages]
      operationId: createPackage
      summary: Создать пакет и получить ссылки для загрузки
      description: |
        Принимает описание файлов, создаёт `Package` и `Document` для каждого файла
        и возвращает временные ссылки для загрузки в хранилище (PUT с тем же `mimeType`).
        Если передан `sha256` и такой файл уже есть в организации, в ответе будет `duplicateOf`
        и `url: null`: файл повторно не загружается и не обрабатывается, его результаты берутся
        у исходного документа.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackageCreate" }
      responses:
        "201":
          description: Пакет создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageCreated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Файл или пакет превышает допустимый размер
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Неподдерживаемый формат файла
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /packages/{packageId}:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags: [Packages]
      operationId: getPackage
      summary: Состояние пакета
      description: Статус, общий прогресс и документы с этапами. Подходит для поллинга, если SSE недоступен.
      responses:
        "200":
          description: Пакет
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{packageId}/start:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      tags: [Packages]
      operationId: startPackage
      summary: Запустить обработку
      description: |
        Вызывается после того, как все файлы загружены. Проверяет, что каждый объект есть
        в хранилище (а при переданном `sha256` — что хеш совпадает), и ставит документы в очередь.
        Дубликаты (`duplicateOf`) не ждёт. Идемпотентен. Отдельного подтверждения загрузки
        по каждому файлу нет.
      responses:
        "202":
          description: Обработка поставлена в очередь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Package" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Не все файлы загружены или хеш не совпал
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /packages/{packageId}/events:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      tags: [Packages]
      operationId: streamPackageEvents
      summary: Поток событий обработки (SSE)
      description: |
        Server-Sent Events. Имя события (`event:`) совпадает с полем `type`:

        - `progress` — изменился статус или общий прогресс пакета. При подключении сервер
          сразу отправляет текущее состояние.
        - `document.stage` — изменился статус этапа конкретного документа. Позволяет показывать
          документ готовым и открывать его результаты, не дожидаясь остальных файлов.

        Соединение закрывается, когда пакет перешёл в `done`, `partial` или `failed`.
        Истина о пакете и документах — `GET /packages/{packageId}`, события только ускоряют
        обновление интерфейса. Авторизация — cookie-сессия `ai_pto_session`
        (браузерный `EventSource` отправляет cookies same-origin автоматически).
      responses:
        "200":
          description: Поток событий
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/PackageEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /packages/{packageId}/reports:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      tags: [Reports]
      operationId: createReport
      summary: Сформировать отчёт по пакету
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCreate" }
      responses:
        "202":
          description: Генерация запущена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Часть документов пакета ещё в обработке
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /objects/{objectId}/documents:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: Документы объекта
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: packageId
          in: query
          description: По умолчанию берётся последний пакет
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/DocumentType" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/DocumentStatus" }
        - name: q
          in: query
          description: Поиск по имени файла
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [fileName, -fileName, createdAt, -createdAt, findings, -findings]
            default: -createdAt
      responses:
        "200":
          description: Страница документов
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Document" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Карточка документа
      description: Метаданные, этапы обработки и извлечённые поля.
      responses:
        "200":
          description: Документ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Documents]
      operationId: updateDocument
      summary: Изменить тип документа
      description: Ручная смена типа запускает повторное извлечение полей и проверку правил.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { $ref: "#/components/schemas/DocumentType" }
      responses:
        "200":
          description: Документ обновлён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Удалить документ
      responses:
        "204": { description: Документ удалён }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}/file:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      operationId: getDocumentFile
      summary: Ссылка на исходный файл
      description: Временная ссылка для просмотра или скачивания оригинала.
      responses:
        "200":
          description: Ссылка на файл
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}/fields:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    patch:
      tags: [Documents]
      operationId: updateDocumentFields
      summary: Исправить извлечённые поля
      description: |
        Изменённые поля помечаются `editedManually: true`, исходное значение сохраняется
        в `originalValue`. После изменения запускается перепроверка связанных правил
        (этап `rules` документа переходит в `running`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: { type: string, examples: [actDate] }
                      value: { type: [string, "null"] }
      responses:
        "200":
          description: Документ с обновлёнными полями
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /documents/{documentId}/recheck:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      tags: [Documents]
      operationId: recheckDocument
      summary: Перезапустить обработку документа
      description: |
        Перезапускает указанные этапы (по умолчанию `rules`) и все последующие.
        Результаты предыдущих этапов берутся из БД, LLM повторно не вызывается,
        если это не требуется.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fromStage: { $ref: "#/components/schemas/Stage" }
      responses:
        "202":
          description: Перепроверка запущена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404": { $ref: "#/components/responses/NotFound" }

  /objects/{objectId}/findings:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Findings]
      operationId: listFindings
      summary: Замечания объекта
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: severity
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/Severity" }
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/FindingStatus" }
        - name: documentId
          in: query
          schema: { type: string, format: uuid }
        - name: documentType
          in: query
          schema: { $ref: "#/components/schemas/DocumentType" }
        - name: ruleId
          in: query
          schema: { type: string }
        - name: packageId
          in: query
          description: По умолчанию берётся последний пакет
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Поиск по тексту замечания
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [severity, -severity, confidence, -confidence, createdAt, -createdAt]
            default: severity
      responses:
        "200":
          description: Страница замечаний
          content:
            application/json:
              schema:
                type: object
                required: [items, meta, counts]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Finding" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
                  counts:
                    description: Счётчики по текущим фильтрам, кроме серьёзности и статуса (для переключателей в интерфейсе)
                    type: object
                    properties:
                      bySeverity: { $ref: "#/components/schemas/SeverityCounts" }
                      byStatus:
                        type: object
                        additionalProperties: { type: integer, minimum: 0 }
        "404": { $ref: "#/components/responses/NotFound" }

  /findings/bulk:
    post:
      tags: [Findings]
      operationId: bulkUpdateFindings
      summary: Массовое изменение статуса замечаний
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
                status: { $ref: "#/components/schemas/FindingStatus" }
                comment: { type: string }
      responses:
        "200":
          description: Результат
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer, minimum: 0 }
        "422": { $ref: "#/components/responses/ValidationError" }

  /findings/{findingId}:
    parameters:
      - $ref: "#/components/parameters/FindingId"
    get:
      tags: [Findings]
      operationId: getFinding
      summary: Замечание
      responses:
        "200":
          description: Замечание
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Findings]
      operationId: updateFinding
      summary: Решение инженера по замечанию
      description: |
        Меняет статус и/или комментарий. При отклонении (`dismissed`) комментарий обязателен.
        Каждое изменение записывается в историю.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FindingUpdate" }
      responses:
        "200":
          description: Замечание обновлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /findings/{findingId}/history:
    parameters:
      - $ref: "#/components/parameters/FindingId"
    get:
      tags: [Findings]
      operationId: getFindingHistory
      summary: История изменений замечания
      responses:
        "200":
          description: История
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FindingHistoryEntry" }
        "404": { $ref: "#/components/responses/NotFound" }

  /objects/{objectId}/checklist:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Checklist]
      operationId: getChecklist
      summary: Комплектность объекта
      description: |
        Комплектность считается по объекту: обязательные документы определяются видами работ
        объекта (`workTypes`) и сравниваются с найденными документами. По умолчанию берётся
        последний пакет, `packageId` позволяет посмотреть комплектность прошлой версии.
      parameters:
        - name: packageId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Чек-лист
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checklist" }
        "404": { $ref: "#/components/responses/NotFound" }

  /objects/{objectId}/reports:
    parameters:
      - $ref: "#/components/parameters/ObjectId"
    get:
      tags: [Reports]
      operationId: listReports
      summary: Отчёты объекта
      responses:
        "200":
          description: Отчёты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Report" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/{reportId}:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [Reports]
      operationId: getReport
      summary: Отчёт
      responses:
        "200":
          description: Отчёт
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/{reportId}/download:
    parameters:
      - $ref: "#/components/parameters/ReportId"
    get:
      tags: [Reports]
      operationId: downloadReport
      summary: Скачать PDF отчёта
      responses:
        "200":
          description: PDF-файл
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Отчёт ещё не готов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ai_pto_session
      description: Opaque-токен сессии; в PostgreSQL хранится только его SHA-256, роль и организация читаются из актуального membership.

  parameters:
    ObjectId:
      name: objectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackageId:
      name: packageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FindingId:
      name: findingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: unauthorized, message: Требуется вход в систему }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: not_found, message: Ресурс не найден }
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: forbidden, message: Архивировать объект может только владелец организации }
    Conflict:
      description: Конфликт состояния
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: conflict, message: Переход статуса active → draft запрещён }
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            code: validation_error
            message: Проверьте введённые данные
            details:
              - { field: name, message: Обязательное поле }

  schemas:
    # ---------- Общее ----------
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинный код ошибки
          examples: [validation_error]
        message:
          type: string
          description: Понятное человеку описание, что случилось и что делать
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }

    SeverityCounts:
      type: object
      required: [error, warning, info, critical]
      properties:
        error: { type: integer, minimum: 0 }
        warning: { type: integer, minimum: 0 }
        info: { type: integer, minimum: 0 }
        critical: { type: integer, minimum: 0 }

    # ---------- Перечисления ----------
    Severity:
      type: string
      enum: [error, warning, info, critical]
      description: Ошибка (не пройдёт приёмку), замечание (проверить вручную), сведения, критично

    FindingStatus:
      type: string
      enum: [open, accepted, dismissed, fixed]
      description: Открыто, принято (в отчёт подрядчику), отклонено (ложное срабатывание), исправлено

    DocumentType:
      type: string
      x-draft: true
      enum:
        - aosr
        - general_work_log
        - concrete_log
        - welding_log
        - material_passport
        - as_built_scheme
        - test_report
        - other
        - unknown
      description: |
        aosr: акт освидетельствования скрытых работ; general_work_log: общий журнал работ;
        concrete_log: журнал бетонных работ; welding_log: журнал сварки;
        material_passport: паспорт материалов; as_built_scheme: исполнительная схема;
        test_report: протокол испытаний; unknown: тип не определён.

    DocumentStatus:
      type: string
      enum: [awaiting_upload, uploaded, queued, processing, done, failed, needs_ocr]
      description: |
        Статусы хранения/очереди совпадают с Prisma DocumentStatus.
        needs_ocr: API-флаг для файла без текстового слоя (скан); на первом этапе не обрабатывается.

    Stage:
      type: string
      enum: [extract, ocr, classify, parse, rules, explain]
      description: Совпадает с Prisma StageName (этап report в БД отсутствует)

    StageStatus:
      type: string
      enum: [pending, running, succeeded, failed, skipped]
      description: Совпадает с Prisma StageStatus (succeeded вместо done)

    PackageStatus:
      type: string
      enum: [uploading, queued, processing, done, partial, failed]
      description: partial означает, что часть документов не удалось обработать, остальные готовы

    ChecklistStatus:
      type: string
      enum: [missing, partial, complete]
      description: Совпадает с Prisma ChecklistItemStatus

    ReportStatus:
      type: string
      enum: [queued, generating, ready, failed]
      description: Совпадает с Prisma ReportStatus

    # ---------- Пользователь ----------
    User:
      type: object
      required: [id, email, name, organizationId, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        organizationId: { type: string, format: uuid }
        role:
          type: string
          enum: [owner, engineer]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }

    ProtectedResponse:
      type: object
      required: [ok, user]
      properties:
        ok: { type: boolean, examples: [true] }
        user: { $ref: "#/components/schemas/User" }

    # ---------- Объекты ----------
    ObjectStatus:
      type: string
      enum: [draft, active, on_hold, completed, archived]

    ObjectGroupRef:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    ObjectType:
      type: object
      required: [id, code, name, group]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [MKD] }
        name: { type: string, examples: [Многоквартирный жилой дом] }
        description: { type: [string, "null"] }
        group: { $ref: "#/components/schemas/ObjectGroupRef" }

    WorkType:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [CONCRETE] }
        name: { type: string, examples: [Монолитные работы] }
        description: { type: [string, "null"] }

    OrganizationRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Counterparty:
      allOf:
        - $ref: "#/components/schemas/OrganizationRef"
        - type: object
          required: [slug]
          properties:
            slug: { type: string }

    ObjectWrite:
      type: object
      required: [code, name, objectTypeId, workTypeIds]
      properties:
        code: { type: string, description: Уникален внутри организации }
        name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: [string, "null"] }
        objectTypeId: { type: string, format: uuid }
        workTypeIds:
          type: array
          items: { type: string, format: uuid }
        customerOrganizationId:
          type: [string, "null"]
          format: uuid
          description: Контрагент (`kind=counterparty`)
        contractorOrganizationId:
          type: [string, "null"]
          format: uuid
          description: Контрагент (`kind=counterparty`)
        description: { type: [string, "null"] }
        customerProfileId:
          type: [string, "null"]
          format: uuid
          description: Игнорируется на этом этапе (профилей требований ещё нет)

    ObjectStatusChange:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [draft, active, on_hold, completed]

    ConstructionObject:
      type: object
      required:
        [
          id,
          code,
          name,
          address,
          status,
          description,
          objectType,
          customer,
          contractor,
          workTypes,
          startDate,
          plannedEndDate,
          actualEndDate,
          createdAt,
          updatedAt,
          archivedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        address: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ObjectStatus" }
        description: { type: [string, "null"] }
        objectType: { $ref: "#/components/schemas/ObjectType" }
        customer:
          oneOf:
            - $ref: "#/components/schemas/OrganizationRef"
            - type: "null"
        contractor:
          oneOf:
            - $ref: "#/components/schemas/OrganizationRef"
            - type: "null"
        workTypes:
          type: array
          items: { $ref: "#/components/schemas/WorkType" }
        startDate: { type: [string, "null"], format: date }
        plannedEndDate: { type: [string, "null"], format: date }
        actualEndDate: { type: [string, "null"], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, "null"], format: date-time }

    # ---------- Пакеты ----------
    PackageCreate:
      type: object
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [fileName, mimeType, sizeBytes]
            properties:
              fileName: { type: string }
              mimeType:
                type: string
                enum:
                  - application/pdf
                  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
                  - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                  - text/csv
              sizeBytes: { type: integer, minimum: 1 }
              sha256:
                type: string
                pattern: "^[a-f0-9]{64}$"
                description: Хэш файла. По нему определяется дубликат в организации, а `start` проверяет, что загруженный объект совпадает по хешу

    PackageCreated:
      type: object
      required: [packageId, version, uploads]
      properties:
        packageId: { type: string, format: uuid }
        version:
          type: integer
          minimum: 1
          description: Порядковый номер проверки на объекте
        uploads:
          type: array
          description: Порядок совпадает с порядком `files` в запросе
          items:
            type: object
            required: [documentId, url, objectKey]
            properties:
              documentId: { type: string, format: uuid }
              url:
                type: [string, "null"]
                format: uri
                description: Временная ссылка для PUT-загрузки в хранилище. `null`, если файл дубликат
              objectKey: { type: [string, "null"] }
              duplicateOf:
                type: [string, "null"]
                format: uuid
                description: Идентификатор уже загруженного документа с тем же `sha256`

    Package:
      type: object
      required: [id, objectId, version, status, progress, createdAt]
      properties:
        id: { type: string, format: uuid }
        objectId: { type: string, format: uuid }
        version:
          type: integer
          minimum: 1
          description: Порядковый номер проверки на объекте
        status: { $ref: "#/components/schemas/PackageStatus" }
        progress:
          type: number
          minimum: 0
          maximum: 1
        documentsCount: { type: integer, minimum: 0 }
        findings: { $ref: "#/components/schemas/SeverityCounts" }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }

    PackageDetail:
      allOf:
        - $ref: "#/components/schemas/Package"
        - type: object
          required: [documents]
          properties:
            documents:
              type: array
              items: { $ref: "#/components/schemas/Document" }

    PackageEvent:
      description: Событие SSE. Поле `type` совпадает с именем события.
      oneOf:
        - $ref: "#/components/schemas/PackageProgressEvent"
        - $ref: "#/components/schemas/DocumentStageEvent"
      discriminator:
        propertyName: type
        mapping:
          progress: "#/components/schemas/PackageProgressEvent"
          document.stage: "#/components/schemas/DocumentStageEvent"

    PackageProgressEvent:
      type: object
      required: [type, packageId, status, progress]
      properties:
        type: { type: string, const: progress }
        packageId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/PackageStatus" }
        progress:
          type: number
          minimum: 0
          maximum: 1

    DocumentStageEvent:
      type: object
      required: [type, packageId, documentId, stage, status]
      properties:
        type: { type: string, const: document.stage }
        packageId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        stage: { $ref: "#/components/schemas/Stage" }
        status: { $ref: "#/components/schemas/StageStatus" }
        error: { $ref: "#/components/schemas/StageError" }

    # ---------- Документы ----------
    StageError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [no_text_layer, corrupted_file, llm_unavailable]
        message:
          type: string
          description: Причина простыми словами, показывается пользователю

    StageState:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/StageStatus" }
        error: { $ref: "#/components/schemas/StageError" }
        finishedAt: { type: [string, "null"], format: date-time }

    Document:
      type: object
      required: [id, objectId, packageId, fileName, mimeType, sizeBytes, type, status, stages, findings, createdAt]
      properties:
        id: { type: string, format: uuid }
        objectId: { type: string, format: uuid }
        packageId: { type: string, format: uuid }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        pageCount:
          type: [integer, "null"]
          description: Для PDF; для XLSX число листов
        type: { $ref: "#/components/schemas/DocumentType" }
        typeConfidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        typeEditedManually: { type: boolean, default: false }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        stages:
          type: object
          description: Состояние каждого этапа обработки
          properties:
            extract: { $ref: "#/components/schemas/StageState" }
            ocr: { $ref: "#/components/schemas/StageState" }
            classify: { $ref: "#/components/schemas/StageState" }
            parse: { $ref: "#/components/schemas/StageState" }
            rules: { $ref: "#/components/schemas/StageState" }
            explain: { $ref: "#/components/schemas/StageState" }
        findings: { $ref: "#/components/schemas/SeverityCounts" }
        createdAt: { type: string, format: date-time }

    DocumentDetail:
      allOf:
        - $ref: "#/components/schemas/Document"
        - type: object
          required: [fields]
          properties:
            fields:
              type: array
              items: { $ref: "#/components/schemas/ExtractedField" }
            lowConfidenceThreshold:
              type: number
              minimum: 0
              maximum: 1
              default: 0.8
              description: Поля с уверенностью ниже порога интерфейс подсвечивает

    ExtractedField:
      type: object
      required: [key, label, value, confidence, editedManually]
      properties:
        key: { type: string, examples: [actDate] }
        label: { type: string, examples: [Дата акта] }
        value: { type: [string, "null"] }
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source: { $ref: "#/components/schemas/SourceRef" }
        editedManually: { type: boolean }
        originalValue:
          type: [string, "null"]
          description: Значение до ручной правки

    SourceRef:
      type: object
      x-draft: true
      description: |
        Место в файле, откуда взято значение. Для PDF заполняются `page` и `bbox`,
        для XLSX `sheet` и `cell`, для DOCX `paragraph` или `table`.
      required: [documentId]
      properties:
        documentId: { type: string, format: uuid }
        page:
          type: integer
          minimum: 1
          description: Номер страницы PDF, с 1
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number, minimum: 0, maximum: 1 }
          description: "[x0, y0, x1, y1] в долях страницы от верхнего левого угла"
        sheet: { type: string }
        cell:
          type: string
          examples: ["C14"]
        paragraph: { type: integer, minimum: 0 }
        quote:
          type: string
          description: Короткая цитата из источника

    # ---------- Замечания ----------
    NormRef:
      type: object
      required: [doc, clause]
      properties:
        doc: { type: string, examples: [СП 70.13330.2012] }
        clause: { type: string, examples: [п. 5.2.3] }
        url: { type: string, format: uri }

    Finding:
      type: object
      required:
        [
          id,
          objectId,
          documentId,
          packageId,
          ruleId,
          ruleVersion,
          severity,
          message,
          sources,
          confidence,
          status,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        objectId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        packageId: { type: string, format: uuid }
        ruleId: { type: string, examples: [aosr.date-after-journal] }
        ruleVersion: { type: string, examples: ["1.0.0"] }
        severity: { $ref: "#/components/schemas/Severity" }
        message:
          type: string
          description: Строгий результат правила, всегда заполнен
        explanation:
          type: [string, "null"]
          description: Пояснение простым языком от LLM, может отсутствовать
        expected: { type: [string, "null"] }
        actual: { type: [string, "null"] }
        normRef: { $ref: "#/components/schemas/NormRef" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceRef" }
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status: { $ref: "#/components/schemas/FindingStatus" }
        comment: { type: [string, "null"] }
        decidedBy:
          type: [string, "null"]
          format: uuid
        decidedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FindingUpdate:
      type: object
      minProperties: 1
      properties:
        status: { $ref: "#/components/schemas/FindingStatus" }
        comment: { type: string }

    FindingHistoryEntry:
      type: object
      required: [at, userId, fromStatus, toStatus]
      properties:
        at: { type: string, format: date-time }
        userId: { type: string, format: uuid }
        fromStatus: { $ref: "#/components/schemas/FindingStatus" }
        toStatus: { $ref: "#/components/schemas/FindingStatus" }
        comment: { type: [string, "null"] }

    # ---------- Комплектность и сводка ----------
    Checklist:
      type: object
      required: [readiness, items]
      properties:
        readiness:
          type: number
          minimum: 0
          maximum: 1
        items:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }

    ChecklistItem:
      type: object
      required: [documentType, title, required, found, status, documentIds]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        title: { type: string, examples: [Акты скрытых работ] }
        required:
          type: integer
          minimum: 0
          description: Сколько документов требуется
        found:
          type: integer
          minimum: 0
          description: Сколько найдено
        status: { $ref: "#/components/schemas/ChecklistStatus" }
        documentIds:
          type: array
          items: { type: string, format: uuid }

    ObjectSummary:
      type: object
      required: [readiness, findings, pendingDecisions, byDocumentType, topRules]
      properties:
        readiness:
          type: number
          minimum: 0
          maximum: 1
        findings: { $ref: "#/components/schemas/SeverityCounts" }
        pendingDecisions:
          type: integer
          minimum: 0
          description: Замечаний в статусе open
        byDocumentType:
          type: array
          items:
            type: object
            required: [documentType, counts]
            properties:
              documentType: { $ref: "#/components/schemas/DocumentType" }
              counts: { $ref: "#/components/schemas/SeverityCounts" }
        topRules:
          type: array
          items:
            type: object
            required: [ruleId, title, count]
            properties:
              ruleId: { type: string }
              title: { type: string }
              count: { type: integer, minimum: 1 }
        history:
          type: array
          description: Динамика по проверкам (пакетам)
          items:
            type: object
            required: [packageId, version, findings]
            properties:
              packageId: { type: string, format: uuid }
              version: { type: integer }
              findings: { $ref: "#/components/schemas/SeverityCounts" }
              createdAt: { type: string, format: date-time }
        nextActions:
          type: array
          items:
            type: object
            required: [kind, message]
            properties:
              kind:
                type: string
                enum: [missing_document, pending_findings, failed_document, needs_ocr]
              message: { type: string }
              count: { type: integer }

    # ---------- Отчёты ----------
    ReportCreate:
      type: object
      properties:
        scope:
          type: string
          enum: [accepted, errors, all_open]
          default: accepted
          description: Что включить, принятые замечания, только ошибки или все открытые
        recipient:
          type: string
          description: Кому адресован отчёт (подрядчик)

    Report:
      type: object
      required: [id, objectId, packageId, status, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        objectId: { type: string, format: uuid }
        packageId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ReportStatus" }
        version: { type: integer, minimum: 1 }
        scope: { type: string, enum: [accepted, errors, all_open] }
        recipient: { type: [string, "null"] }
        findingsCount: { type: integer, minimum: 0 }
        error: { $ref: "#/components/schemas/StageError" }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        readyAt: { type: [string, "null"], format: date-time }
